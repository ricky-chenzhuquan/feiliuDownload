name: Build & Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            targets: aarch64-apple-darwin
            artifact-name: feiliu-macos
          - os: windows-latest
            targets: ""
            artifact-name: feiliu-windows

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Install frontend deps
        working-directory: app
        run: pnpm install --frozen-lockfile

      # 配置了 TAURI_SIGNING_PRIVATE_KEY secret 时，额外产出签名更新包（用于应用内自动更新）
      - name: Build Tauri app
        working-directory: app
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # --config 的 JSON 必须单引号直传：经变量拼接 + npm 转发会带上
          # 字面反斜杠，tauri CLI 把 JSON 当文件路径（v0.1.1 签名构建实测）
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "updater signing enabled"
            pnpm tauri build --config '{"bundle":{"createUpdaterArtifacts":true}}'
          else
            pnpm tauri build
          fi

      - name: Collect artifacts (macOS)
        if: matrix.os == 'macos-latest'
        working-directory: app/src-tauri/target/release/bundle
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist-out"
          cp dmg/*.dmg "$GITHUB_WORKSPACE/dist-out/" || true
          cp macos/*.app.tar.gz "$GITHUB_WORKSPACE/dist-out/" 2>/dev/null || true
          cp macos/*.app.tar.gz.sig "$GITHUB_WORKSPACE/dist-out/" 2>/dev/null || true
          ls -la "$GITHUB_WORKSPACE/dist-out"

      - name: Collect artifacts (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        working-directory: app/src-tauri/target/release/bundle
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist-out"
          cp nsis/*-setup.exe "$GITHUB_WORKSPACE/dist-out/" 2>/dev/null || true
          cp nsis/*-setup.exe.sig "$GITHUB_WORKSPACE/dist-out/" 2>/dev/null || true
          cp msi/*.msi "$GITHUB_WORKSPACE/dist-out/" 2>/dev/null || true
          ls -la "$GITHUB_WORKSPACE/dist-out"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: dist-out/*
          if-no-files-found: error

  release:
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Generate updater manifest (latest.json)
        env:
          REPO: ricky-chenzhuquan/feiliuDownload
          TAG: ${{ github.ref_name }}
        run: node scripts/gen-latest-json.js dist "$TAG" "$REPO"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/**/*.dmg
            dist/**/*.msi
            dist/**/*-setup.exe
            dist/**/*.app.tar.gz
            dist/**/*.app.tar.gz.sig
            dist/**/*-setup.exe.sig
            dist/latest.json
